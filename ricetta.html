<!doctype html>
<html lang="it" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ricetta — Ricette personali</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<a class="skip" href="#main">Salta al contenuto</a>

<header class="appbar">
  <div class="wrap appbar__inner">
    <a class="brand" href="index.html">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v8a3 3 0 0 0 6 0V3"/><path d="M9 11v10"/><path d="M17 3c-1.5 2-2 4-2 6v3h3"/><path d="M18 12v9"/></svg>
      </span>
      <span class="brand__name" data-brand-name>Ricette personali</span>
    </a>

    <nav class="navlinks" data-navlinks></nav>

    <div class="appbar__actions">
      <div class="appbar__desktop">
        <div class="segmented" data-langs role="group"></div>
        <button class="btn btn--icon" type="button" data-theme-toggle></button>
      </div>
      <button class="btn btn--icon appbar__burger" type="button" data-burger aria-expanded="false" aria-controls="drawer"></button>
    </div>
  </div>
</header>

<div class="scrim" data-scrim hidden></div>
<aside class="drawer" id="drawer" data-drawer hidden tabindex="-1" aria-label="Menu">
  <div class="drawer__head">
    <span class="drawer__title" data-drawer-title>Menu</span>
    <button class="btn btn--icon" type="button" data-drawer-close></button>
  </div>
  <nav class="drawer__nav" data-navlinks data-with-icons></nav>
  <div class="drawer__foot">
    <div class="drawer__section">
      <span class="label" data-label="lang">Lingua</span>
      <div class="segmented" data-langs role="group"></div>
    </div>
    <div class="drawer__section">
      <span class="label" data-label="themeSection">Tema</span>
      <button class="btn btn--icon" type="button" data-theme-toggle></button>
    </div>
  </div>
</aside>

<main id="main">
  <div class="wrap">
    <a class="backlink" id="back" href="index.html">Tutte le ricette</a>

    <figure class="recipe-photo" id="photo" hidden>
      <img id="photoImg" alt="">
    </figure>

    <div class="recipe-head">
      <h1 id="title"></h1>
      <p class="lede" id="lede"></p>
      <ul class="facts" id="facts"></ul>
    </div>

    <div class="layout">
      <div class="sidecol">
        <section class="panel">
          <div class="servings">
            <span class="label" id="servingsLabel">Porzioni</span>
            <div class="stepper">
              <button id="less" type="button"></button>
              <output id="servingsValue">2</output>
              <button id="more" type="button"></button>
            </div>
          </div>
          <h2 class="panel__title" id="ingredientsTitle">Ingredienti</h2>
          <ul class="ledger" id="ledger"></ul>
          <p class="footnote" id="scaledNote"></p>
          <div class="panel__actions">
            <button class="btn btn--secondary" id="print" type="button">Stampa</button>
            <button class="btn btn--secondary" id="reset" type="button">Azzera</button>
          </div>
        </section>

        <section class="panel">
          <h2 class="panel__title" id="macrosTitle">Valori nutrizionali</h2>
          <div class="segmented segmented--wide" id="macroToggle" role="group"></div>
          <div class="kcal">
            <b id="kcalValue">0</b>
            <span id="kcalUnit">kcal</span>
          </div>
          <div class="macrobar" id="macrobar"></div>
          <ul class="macrolist" id="macrolist"></ul>
          <button class="btn btn--secondary btn--full" id="breakdownOpen" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12h5M3 6h11M3 18h8"/></svg>
            <span>Da dove arrivano</span>
          </button>
          <p class="footnote" id="macroNote"></p>
          <details class="issues" id="issues" hidden>
            <summary></summary>
            <ul></ul>
          </details>
        </section>
      </div>

      <div>
        <h2 class="section-title" id="stepsTitle">Preparazione</h2>
        <ol class="steps" id="steps"></ol>

        <section class="gallery" id="gallerySection" hidden>
          <h2 class="section-title" id="galleryTitle">Il procedimento in foto</h2>
          <ul class="photogrid" id="photogrid"></ul>
        </section>

        <section class="notes" id="notes">
          <h2 class="section-title" id="notesTitle">Note e conservazione</h2>
          <dl id="notesList"></dl>
        </section>

        <p class="source" id="source"></p>
      </div>
    </div>
  </div>
</main>

<dialog class="sheet" id="breakdown" aria-labelledby="breakdownTitle">
  <div class="sheet__head">
    <h2 class="sheet__title" id="breakdownTitle">Da dove arrivano</h2>
    <button class="btn btn--icon" id="breakdownClose" type="button"></button>
  </div>
  <div class="sheet__body">
    <div class="segmented segmented--grid" id="breakdownMetric" role="group"></div>
    <p class="sheet__lead" id="breakdownLead"></p>
    <ol class="contrib" id="contribList"></ol>
    <div class="contrib__excluded" id="contribExcluded" hidden>
      <span class="label" id="contribExcludedTitle"></span>
      <p id="contribExcludedList"></p>
    </div>
    <p class="footnote" id="breakdownNote"></p>
  </div>
</dialog>

<script type="module" src="assets/js/recipe.js"></script>
</body>
</html>
